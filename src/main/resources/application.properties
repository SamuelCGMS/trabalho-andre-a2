spring.application.name=a2-otimizacao
server.address=127.0.0.1
server.port=${A2_API_PORT:8080}

spring.datasource.url=jdbc:postgresql://127.0.0.1:${A2_POSTGRES_PORT:15432}/a2db
spring.datasource.username=a2
spring.datasource.password=a2pass
spring.datasource.hikari.maximum-pool-size=30

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

spring.data.redis.host=127.0.0.1
spring.data.redis.port=${A2_REDIS_PORT:16379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=1s

app.cache.prefixo=a2
app.cache.ttl-produto-segundos=60
app.cache.ttl-categoria-segundos=300

app.seed.habilitado=true
app.seed.clientes=5000
app.seed.produtos=10000
app.seed.pedidos=100000
